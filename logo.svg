<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Plantas de Urabá">
  <defs>
    <linearGradient id="g-anillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7d2f"/>
      <stop offset="1" stop-color="#2c5a21"/>
    </linearGradient>
    <linearGradient id="g-hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa84f"/>
      <stop offset="1" stop-color="#3f7d2f"/>
    </linearGradient>
  </defs>

  <!-- Aro exterior -->
  <circle cx="100" cy="100" r="97" fill="#fffdf5" stroke="#2b2b2b" stroke-width="5"/>
  <circle cx="100" cy="100" r="86" fill="#f3f0e3" stroke="#d8ccb4" stroke-width="2.5"/>

  <!-- Agua: onda del río (Urabá) -->
  <path d="M56 150 Q 74 140 92 150 T 128 150 T 164 150"
        fill="none" stroke="#2f6db3" stroke-width="6" stroke-linecap="round"/>
  <path d="M70 164 Q 86 156 102 164 T 134 164"
        fill="none" stroke="#2f6db3" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Raíces -->
  <path d="M92 130 Q 99 136 100 130" fill="none" stroke="#3f7d2f" stroke-width="4" stroke-linecap="round"/>
  <path d="M108 130 Q 101 136 100 130" fill="none" stroke="#3f7d2f" stroke-width="4" stroke-linecap="round"/>

  <!-- Tallo central -->
  <path d="M100 130 C 100 116 100 102 100 88"
        fill="none" stroke="#2c5e20" stroke-width="6" stroke-linecap="round"/>

  <!-- Hoja izquierda -->
  <path d="M100 102 C 88 92 72 74 62 56 C 80 64 92 84 100 102 Z"
        fill="url(#g-hoja)" stroke="#2f5e20" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hoja derecha -->
  <path d="M100 92 C 112 84 130 68 140 50 C 124 60 106 76 100 92 Z"
        fill="#4f9740" stroke="#2f5e20" stroke-width="3" stroke-linejoin="round"/>

  <!-- Brote nuevo -->
  <path d="M100 84 C 95 74 95 66 100 58 C 105 66 105 74 100 84 Z"
        fill="#7cbf5e" stroke="#2f5e20" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Destello (sol) -->
  <g stroke="#e0b83c" stroke-width="4" stroke-linecap="round">
    <path d="M100 20 L100 28"/>
    <path d="M60 30 L65 37"/>
    <path d="M140 30 L135 37"/>
    <path d="M28 66 L35 70"/>
    <path d="M172 66 L165 70"/>
  </g>
</svg>